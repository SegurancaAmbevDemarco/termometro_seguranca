<title>Termômetro de Segurança T2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de mês no topo, abas (Ranking / Bases / Regras); tabelas largas rolam dentro do próprio contêiner. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15202b; --muted:#5a6775; --line:#d9e0e7;
  --accent:#1d5bbf; --accent-soft:#e3ecfa; --accent-ink:#ffffff;
  --good:#17845a; --good-bg:#e1f3ea; --mid:#9a6c00; --mid-bg:#fbf0d2; --low:#c25418; --low-bg:#fbe5d8; --bad:#bf3434; --bad-bg:#f9e0e0; --na:#7c8894; --na-bg:#eceff2;
  --mercury:#d23b2f;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b2530; --ink:#e4eaf0; --muted:#94a2b0; --line:#28343f;
  --accent:#78a4f2; --accent-soft:#1d2c44; --accent-ink:#0e141a;
  --good:#46c08a; --good-bg:#15302a; --mid:#e0b543; --mid-bg:#33290f; --low:#ef9255; --low-bg:#3a2416; --bad:#ef6f6f; --bad-bg:#3b1c1f; --na:#8592a0; --na-bg:#222c36;
  --mercury:#ef5a4c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b2530; --ink:#e4eaf0; --muted:#94a2b0; --line:#28343f;
  --accent:#78a4f2; --accent-soft:#1d2c44; --accent-ink:#0e141a;
  --good:#46c08a; --good-bg:#15302a; --mid:#e0b543; --mid-bg:#33290f; --low:#ef9255; --low-bg:#3a2416; --bad:#ef6f6f; --bad-bg:#3b1c1f; --na:#8592a0; --na-bg:#222c36;
  --mercury:#ef5a4c; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.6rem;font-weight:750}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.eyebrow{font-family:var(--f-display);font-stretch:90%;font-size:.72rem;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* topo */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.therm{width:22px;height:64px;position:relative;flex:none}
.therm .tube{position:absolute;left:7px;top:0;width:8px;height:50px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.therm .hg{position:absolute;left:0;right:0;bottom:0;background:var(--mercury);transition:height .6s ease}
.therm .bulb{position:absolute;left:1px;bottom:0;width:20px;height:20px;border-radius:50%;background:var(--mercury)}
.brand .sub{color:var(--muted);font-size:.85rem}
.br-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.br-score{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.br-score .big{font-family:var(--f-display);font-stretch:80%;font-size:2rem;font-weight:800;line-height:1}
.br-score .big small{font-size:.9rem;color:var(--muted);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=month],input[type=search],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-stretch:88%;font-weight:650;font-size:.98rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mercury)}
.panel{display:flex;flex-direction:column;gap:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.notice.warn{border-color:var(--mid);background:var(--mid-bg)}
.notice.err{border-color:var(--bad);background:var(--bad-bg)}

/* tabelas de ranking */
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--surface-2);font-family:var(--f-display);font-stretch:88%;font-weight:650;font-size:.78rem;color:var(--muted);vertical-align:bottom}
thead th .dir{display:block;font-family:var(--f-body);font-weight:400;font-size:.7rem;letter-spacing:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.brasil td{font-weight:600;background:var(--surface-2)}
td.rk{font-family:var(--f-display);font-stretch:80%;font-weight:750;font-size:1.05rem;width:44px}
td.rk.ano{color:var(--muted);font-weight:600;font-size:.95rem}
td.name{min-width:180px;white-space:normal}
td.name .n{font-weight:600}
td.name .s{color:var(--muted);font-size:.78rem}
.delta{font-family:var(--f-mono);font-size:.75rem}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.kc{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.kc .v{font-family:var(--f-mono);font-size:.8rem}
.pt{display:inline-block;min-width:34px;text-align:center;font-family:var(--f-mono);font-size:.74rem;font-weight:500;border-radius:4px;padding:1px 4px}
.p11{background:var(--good-bg);color:var(--good)} .p55{background:var(--mid-bg);color:var(--mid)} .p275{background:var(--low-bg);color:var(--low)} .p0{background:var(--bad-bg);color:var(--bad)} .pna{background:var(--na-bg);color:var(--na)}
.total{display:flex;align-items:center;gap:8px;min-width:150px}
.total .val{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:1.15rem;min-width:44px;text-align:right}
.bar{position:relative;height:8px;flex:1;min-width:80px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--mercury);border-radius:4px}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:var(--surface)}
.heat{font-family:var(--f-mono);font-size:.8rem;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);align-items:center}

/* resumo */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-stretch:82%;font-size:1.6rem;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.tile b small{font-size:.85rem;color:var(--muted);font-weight:600}
.rzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
svg.chart .lbl{fill:var(--ink);font-size:12px;font-family:var(--f-mono);font-weight:500}
svg.chart .lbl2{fill:var(--ink);font-size:12px;font-family:var(--f-body)}
svg.chart .real{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
svg.chart .proj{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
svg.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.chart .dot.last{fill:var(--mercury)}
svg.chart .pdot{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
svg.chart rect.bar.p11{fill:var(--good)} svg.chart rect.bar.p55{fill:var(--mid)} svg.chart rect.bar.p275{fill:var(--low)} svg.chart rect.bar.p0{fill:var(--bad)}
svg.chart g:hover rect.bar{opacity:.8}
.key{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-left:6px}
.key.proj{border-top:2px dashed var(--muted)}
.multiples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
svg.chart.small{max-height:90px}
.mult{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mult .mh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.85rem}
.mult .mf{font-size:.72rem}
.rztable td,.rztable th{text-align:left}
.rztable .curm{background:var(--accent-soft)}
/* bases */
.status-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.grid-kpi{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:12px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.slot{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:start;padding-block:6px;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--line);border:1px solid var(--muted)}
.dot.ok{background:var(--good);border-color:var(--good)}
.slot .lbl{font-weight:500;min-width:0}
.slot .meta{color:var(--muted);font-size:.78rem}
.slot .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);background:var(--surface-2)}
.man{font-family:var(--f-body);font-size:.66rem;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 3px;margin-left:2px}
.qin{display:flex;gap:4px;align-items:center;white-space:nowrap}
.qin input{width:70px;min-height:28px;padding:3px 6px}
.qin input.pts{width:52px}
.qv{font-family:var(--f-mono);font-size:.82rem}
table.quartis td{white-space:nowrap}
.manin{display:flex;gap:4px;align-items:center}
.manin input{width:84px;min-height:28px;padding:3px 6px}
details.warns{font-size:.82rem}
details.warns summary{cursor:pointer;color:var(--mid)}
details.warns ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}

/* regras */
.rules td{white-space:normal;vertical-align:top}
.band{display:flex;flex-wrap:wrap;gap:4px}
.qlist{display:flex;flex-direction:column;gap:8px;margin:0;padding-left:20px}
.qlist li{max-width:80ch}

/* modal */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,15,20,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.dlg>header{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg>.body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px;font-family:var(--f-mono);font-size:.8rem}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:6px;padding:6px 8px;font-size:.82rem;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:.7rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.trend{display:flex;gap:4px;align-items:flex-end;height:90px;padding-top:6px}
.trend .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.trend .c i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:3px 3px 0 0}
.trend .c i.cur{background:var(--mercury)}
.trend .c span{font-size:.65rem;color:var(--muted);font-family:var(--f-mono)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:calc(100vw - 32px)}
@media (max-width:760px){
  .top{grid-template-columns:1fr auto}
  .controls{grid-column:1/-1;justify-content:flex-start}
  h1{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="therm" aria-hidden="true"><div class="tube"><div class="hg" id="hg" style="height:0%"></div></div><div class="bulb"></div></div>

        <div class="eyebrow">Segurança · Tier 2 · Demarco / Ambev</div>

  <div id="globalNotice"></div>
  <main id="view" class="panel"></main>
</div>

      functions: ['Gerente', 'Lider DU+WH', 'Lider DU', 'Lider WH', 'Lider Frota', 'SST'],
      // Regional (lista de unidades da liderança) -> Geo do Ranking

                     'RIO DE JANEIRO/ ESPIRITO SANTO': 'Geo RJ/ES', 'SÃO PAULO': 'Geo SP', 'SUL': 'Geo Sul' },
      // Empresa WH digitada à mão na planilha (linha 94 das abas Base) para operações sem armazém no QLP

      // 'NA' digitado no Painel (Z16/AD16)

      // Brasil (geo) = média simples das 7 regionais (term.xlsx 'Base_Mon. Líder'!X9)

    compute(inputs, ctx) {
      const cfg = Object.assign({}, M.defaultConfig, (ctx && ctx.config) || {});
      const warnings = [];
      const FN = cfg.functions;
      const fnIdx = {}; FN.forEach((f, i) => { fnIdx[norm(f)] = i; });

      // ---- de-paras (1ª ocorrência, case-insensitive)
      const firstMap = (pairs) => { const m = new Map(); for (const [k, v] of pairs) { const n = norm(k); if (k != null && !m.has(n)) m.set(n, v); } return m; };
      const funcMap = firstMap(cfg.funcoes);          // cargo (ou ATIVIDADE&CARGO) -> grupo
      const unitMap = firstMap(cfg.unidadesGinfo);    // filial Ginfo -> Ag. Unidades
      const entMap = firstMap(cfg.entidades);         // ENTIDADE ABI -> Nome Demarco
      const metaMap = new Map();
      for (const row of cfg.metas) { const n = norm(row[0]); if (!metaMap.has(n)) metaMap.set(n, row.slice(2, 7).map(n0)); }
      const flags = new Map(); for (const [op, arm, ofi] of cfg.unidadesFlags) if (!flags.has(norm(op))) flags.set(norm(op), { arm: norm(arm), ofi: norm(ofi) });
      const notApplicable = (op, t) => { const f = flags.get(norm(op)); if (!f) return false;
        return (t === 'GSO' && f.ofi === 'NÃO') || (t === 'GSA' && f.arm === 'NÃO'); };
      // Excel não faz TRIM: 'SUPERVISOR DE MANUTENÇÃO' (Lider DU) ≠ 'SUPERVISOR DE MANUTENÇÃO ' (Lider Frota).
      // Busca primeiro a chave exata (só maiúsculas), depois a chave com trim.
      const upNoTrim = s => String(s == null ? '' : s).toUpperCase();
      const funcExact = new Map(); for (const [k, v] of cfg.funcoes) if (k != null && !funcExact.has(upNoTrim(k))) funcExact.set(upNoTrim(k), v);
      const grp = (cargo) => { let g = funcExact.get(upNoTrim(cargo)); if (g == null) g = funcMap.get(norm(cargo));
        return g == null ? null : (fnIdx[norm(g)] ?? null); };

      // ---- unidades da liderança (dedup por Operação: AS LOUVEIRA uma vez)
      const lus = []; const seenOp = new Set();
      for (const [ginfo, regional, op] of cfg.leaderUnits) {
        if (op == null || seenOp.has(norm(op))) continue; seenOp.add(norm(op));
        lus.push({ ginfo, regional, op });
      }

      // ---- metas (QLP lideranças + QLP ABI): meta[op][fi][t]
      const meta = new Map();
      const addMeta = (op, fi, h) => {
        const per = metaMap.get(norm(FN[fi])); if (!per) return;
        if (!meta.has(norm(op))) meta.set(norm(op), FN.map(() => TYPES.map(() => 0)));
        const a = meta.get(norm(op))[fi]; TYPES.forEach((t, ti) => { a[ti] += h * per[ti]; });
      };
      const empWH = new Map();
      const qlp = (inputs.qlp || []).filter(r => norm(r.tipoCargo) === 'LIDERANÇAS');
      if (!inputs.qlp) warnings.push('Base QLP (DM People) não enviada – metas de terceiros zeradas.');
      for (const r of qlp) {
        const key = norm(r.operacao) + '|' + norm(r.atividade);
        if (!empWH.has(key)) empWH.set(key, r.empresa);
        const ajuste = norm(r.cargo).slice(0, 7) === 'GERENTE' ? 'GERENTE' : String(r.atividade ?? '') + String(r.cargo ?? '');
        const fi = grp(ajuste);
        if (fi == null) continue;
        addMeta(r.operacao, fi, n0(r.qlpTotal) - (n0(r.qlpFerias) + n0(r.qlpAfastado)));
      }
      const abiNoOp = new Set();
      for (const r of inputs.lid_qlp_abi || []) {
        const op = entMap.get(norm(r.entidade)); const fi = grp(r.desCargo);
        if (!op) { if (r.entidade) abiNoOp.add(r.entidade); continue; }
        if (fi == null) continue;
        addMeta(op, fi, n0(r.headcount));
      }
      if (abiNoOp.size) warnings.push(`QLP ABI: ${abiNoOp.size} entidade(s) sem de-para de operação (meta ignorada): ${[...abiNoOp].slice(0, 6).join('; ')}${abiNoOp.size > 6 ? '…' : ''}`);

      // ---- executado: cnt[t][unitKey][fi][q]
      const cnt = {}; TYPES.forEach(t => { cnt[t] = new Map(); });
      const bump = (t, key, fi, q, v) => {
        if (!cnt[t].has(key)) cnt[t].set(key, FN.map(() => [0, 0, 0]));
        cnt[t].get(key)[fi][q] += v;
      };
      const maxDay = {};
      for (const t of TYPES) {
        const rows = inputs[GINFO[t]];
        if (!rows) { warnings.push(`Base ${TYPE_LABEL[t]} (Ginfo) não enviada.`); continue; }
        let cargoField = 'funcao';
        if (t === 'Blitz') {   // cabeçalhos FUNÇÃO/REALIZADO POR trocados no export: usa a coluna com mais cargos conhecidos
          const hits = f => rows.reduce((s, r) => s + (grp(r[f]) != null ? 1 : 0), 0);
          if (hits('realizadoPor') > hits('funcao')) cargoField = 'realizadoPor';
        }
        let semFunc = 0, semUni = new Set(), md = null;
        for (const r of rows) {
          const q = quinz(r.data); const dd = dayOf(r.data);
          if (dd != null && t === 'GSD') { const s = String(r.data); if (md == null || s > md) md = s; }
          const fi = grp(r[cargoField]);
          let un = unitMap.get(norm(r.filial));
          if (un == null) { semUni.add(r.filial); if (t !== 'GSD') un = r.filial; }   // GSD: sem fallback (XLOOKUP sem IFERROR)
          if (fi == null) { semFunc++; continue; }
          if (un == null || q == null) continue;
          bump(t, norm(un), fi, q, 1);
        }
        if (t === 'GSD') maxDay.GSD = md;
        if (semFunc) warnings.push(`${TYPE_LABEL[t]} Ginfo: ${semFunc} linha(s) com função sem de-para (não contam).`);
        if (semUni.size) warnings.push(`${TYPE_LABEL[t]} Ginfo: filial(is) sem de-para de unidade: ${[...semUni].join('; ')}`);
      }
      let mdDMA = null;
      if (!inputs.lid_dto_dma) warnings.push('Base DTO DM Analytics não enviada.');

    const doc = rescore(S.results[m], m);

    S.results[m] = doc;
  }

  /* ---------- quem é o usuário ---------- */
  async function whoId() { return S.store ? S.store.me() : null; }
  async function resolveNames(ids) {

  /* ---------- cálculo de visão ---------- */
  function rowsOf(res, kind) {
    if (!res) return [];

  }
  function yearRows(month, kind) {
    if (kind === 'brasil') { // como no Histórico: Brasil do ano = média das médias anuais das regionais

      return [{ id: 'Brasil', avg: g.reduce((s, r) => s + r.avg, 0) / g.length, n: b.n, months: b.months, rank: null }];

  function yearRowsRaw(month, kind) {
    const y = month.slice(0, 4);

    return C.yearView(ms.map(m => ({ month: m, [kind]: rowsOf(S.results[m], kind).map(r => ({ id: r.id, total: r.t, rank: r.r })), brasil: kind === 'brasil' ? S.results[m].brasil && { id: S.results[m].brasil.id, total: S.results[m].brasil.t, rank: 1 } : null })), kind);

  function labelOf(kind, id) {

    if (kind === 'ops') return { n: OPNAME[id] || id, s: 'Cód. ' + id };

  /* ---------- RANKING ---------- */
  function totalCell(t) {
    if (t == null) return '<div class="total"><span class="val">–</span></div>';

  }
  function kpiHead() {
    return K.map(k => `<th title="${esc(SC.kpis[k].name)}">${esc(SC.kpis[k].short)}<span class="dir">${SC.kpis[k].dir === 'menor' ? '↓ menor melhor' : '↑ maior melhor'}</span></th>`).join('');
  }
  function sectionMonth(kind, title, opts) {

      let delta = '';
      if (!isBr && pv && pv.r && r.r) { const d = pv.r - r.r; delta = d > 0 ? `<span class="delta up" title="Subiu ${d} posição(ões)">▲${d}</span>` : d < 0 ? `<span class="delta down" title="Caiu ${-d} posição(ões)">▼${-d}</span>` : '<span class="delta muted">=</span>'; }

    return `<section class="section">
      <div class="section-head"><div><div class="eyebrow">${esc(opts.eyebrow)}</div><h2>${esc(title)}</h2></div>${filters}</div>
      <div class="tablebox"><table><thead><tr><th>Rnk<span class="dir">ano</span></th><th>Rnk<span class="dir">mês</span></th><th></th><th>${esc(opts.col)}</th>${hasDetail ? kpiHead() : `<th colspan="${K.length}">KPIs</th>`}<th>Total<span class="dir">de ${SC.totalMax} pts</span></th><th>${esc(MONTHS_PT[+prevMonth(S.month).slice(5) - 1])}<span class="dir">mês ant.</span></th><th>${S.month.slice(0, 4)}<span class="dir">média</span></th></tr></thead>
      <tbody>${rows.map(r => line(r, false)).join('')}${brasil ? line(brasil, true) : ''}${rows.length ? '' : `<tr><td colspan="${K.length + 7}" class="muted">Nenhum resultado para o filtro.</td></tr>`}</tbody></table></div>
    </section>`;
  }
  function sectionYear(kind, title, opts) {
    const y = S.month.slice(0, 4);
    const ms = monthsAvailable().filter(m => m.startsWith(y));
    const rows = yearRows(ms[ms.length - 1] || S.month, kind);
    let list = rows;
    if (kind === 'units') { const f = S.filt; list = rows.filter(r => { const u = UNIT[r.id] || {}; const lb = labelOf(kind, r.id);
      return (!f.geo || u.geo === f.geo) && (!f.op || String(u.apoioCode) === f.op) && (!f.q || lb.n.toLowerCase().includes(f.q.toLowerCase())); }); }
    const br = kind === 'geos' ? yearRows(ms[ms.length - 1] || S.month, 'brasil')[0] : null;
    const cell = t => { if (t == null) return '<td class="heat muted">–</td>'; const p = t / SC.totalMax; const cls = p >= .8 ? 'p11' : p >= .65 ? 'p55' : p >= .5 ? 'p275' : 'p0'; return `<td class="heat"><span class="pt ${cls}">${fmtN(t, 1)}</span></td>`; };
    const line = (r, isBr) => { const lb = labelOf(kind, r.id); return `<tr class="${isBr ? 'brasil' : ''}" data-kind="${kind}" data-id="${esc(r.id)}"><td class="rk">${isBr ? '' : r.rank + 'º'}</td>
      <td class="name"><div class="n">${esc(isBr ? 'Brasil' : lb.n)}</div><div class="s">${esc(lb.s)}</div></td>
      ${ms.map(m => cell(r.months[m] ? r.months[m].total : null)).join('')}

    const filters = kind === 'units' ? `<div class="filters">
        <select id="fGeo" aria-label="Filtrar por regional"><option value="">Todas as regionais</option>${MASTER.geos.filter(g => g.name !== 'Brasil').map(g => `<option ${S.filt.geo === g.name ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>
        <select id="fOp" aria-label="Filtrar por sócio operador"><option value="">Todos os operadores</option>${MASTER.operators.map(o => `<option value="${o.code}" ${S.filt.op === String(o.code) ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select>
        <input type="search" id="fQ" placeholder="Buscar CDD" value="${esc(S.filt.q)}" aria-label="Buscar CDD"></div>` : '';
    return `<section class="section"><div class="section-head"><div><div class="eyebrow">${esc(opts.eyebrow)}</div><h2>${esc(title)}</h2></div>${filters}</div>
      <div class="tablebox"><table><thead><tr><th>Rnk<span class="dir">ano</span></th><th>${esc(opts.col)}</th>${ms.map(m => `<th>${MONTHS_PT[+m.slice(5) - 1]}<span class="dir">pontos</span></th>`).join('')}<th>Média ${y}<span class="dir">de ${SC.totalMax} pts</span></th><th>Meses</th></tr></thead>

  function histNote(res) {

  function openDetail(kind, id) {

    const kpis = r && r.v ? `<div class="tablebox"><table class="rules"><thead><tr><th>KPI</th><th>Resultado</th><th>Pontos</th><th>Faixa</th><th>Valor manual</th><th>Régua do mês</th></tr></thead><tbody>${K.map((k, i) => `<tr><td>${esc(SC.kpis[k].name)}</td><td class="num">${r.v[i] == null ? '<span class="muted">sem dado</span>' : fmtVal(k, r.v[i])}${calcTxt(i)}</td><td><span class="pt ${ptCls(r.p[i])}">${fmtPts(r.p[i])}</span></td><td>${isHist ? '<span class="muted">–</span>' : esc(C.bandOf(r.v[i], k, msc) || '–')}</td><td>${manCell(k, i)}</td><td>${isHist ? '<span class="muted">régua da época</span>' : `<div class="band">${bandChips(k, msc)}</div>`}</td></tr>`).join('')}</tbody></table></div>
      ${canMan ? '<p class="muted" style="font-size:.8rem">O valor manual substitui o calculado só neste mês e recalcula pontos e rankings. Percentuais em %, Velocidade e Estouro no número do KPI. Fica registrado quem informou e quando.</p>' : ''}` : '<p class="muted">Este mês não tem os KPIs abertos (importado do histórico).</p>';
    const maxT = SC.totalMax;
    openDialog(`<header><div><div class="eyebrow">${kind === 'units' ? 'CDD' : kind === 'ops' ? 'Sócio operador' : 'Regional'} · ${esc(monthLabel(S.month))}</div><h2>${esc(id === 'Brasil' ? 'Brasil' : lb.n)}</h2><div class="muted">${esc(lb.s)}</div></div><div class="filters"><button class="btn small" id="toRz">Ver resumo</button><button class="btn small" data-close>Fechar</button></div></header>
      <div class="body">

        ${u ? `<div><b>Código Promax</b>${esc(u.code)}</div><div><b>Apoio logístico</b>${esc(OPNAME[String(u.apoioCode)] || u.apoioName || '–')}</div><div><b>Distribuição urbana</b>${esc(u.duName || '–')}</div><div><b>Centro SAP</b>${esc(u.centro || '–')}</div>` : ''}</div>
        <div><h3>Evolução em ${y}</h3><div class="trend">${hist.map(h => `<div class="c" title="${monthLabel(h.m)}: ${h.t == null ? 'sem dado' : fmtN(h.t, 2)}"><span>${h.t == null ? '' : fmtN(h.t, 0)}</span><i class="${h.m === S.month ? 'cur' : ''}" style="height:${h.t == null ? 0 : Math.max(2, h.t / maxT * 60)}px"></i><span>${MONTHS_PT[+h.m.slice(5) - 1]}</span></div>`).join('')}</div></div>

    $('#dlgInner').querySelectorAll('[data-man]').forEach(b => b.onclick = async () => {

  function bandChips(k, sc) {

  /* ---------- BASES ---------- */

  async function renderBases() {

  /* ---------- ENVIO ÚNICO: várias planilhas/arquivos de uma vez; o sistema identifica cada base ---------- */
  const LID_FAMILY = ['lid_gsd', 'lid_dto_ginfo', 'lid_gso', 'lid_gsa', 'lid_blitz'];
  const VEL_FAMILY = ['vel_trimble', 'vel_argus'];
  const hintOf = s => P.nh(s);
  function detScore(det, slot) { const req = (slot.required || []).filter(f => det.map[f] !== undefined).length; return req * 10 + Object.keys(det.map).length; }
  // escolhe, dentro de uma família de bases com o mesmo layout, qual é a base certa
  function pickFamily(fam, aoa, det, hint) {
    if (fam === 'lid') {
      const hdr = (aoa[det.headerRow] || []).map(hintOf); const ti = hdr.indexOf('tipo');
      if (ti >= 0) {
        const vals = aoa.slice(det.headerRow + 1, det.headerRow + 400).map(r => hintOf(r && r[ti])).filter(Boolean);
        const cnt = re => vals.filter(v => re.test(v)).length;
        if (cnt(/^blitz/) > vals.length / 2) return { slot: 'lid_blitz' };
        if (cnt(/gsdpq/) > vals.length / 2) return { slot: 'lid_gsd' };
        return { slot: 'lid_dto_ginfo' };
      }
      if (/\bgso\b|oficina/.test(hint)) return { slot: 'lid_gso' };
      if (/\bgsa\b|armaz/.test(hint)) return { slot: 'lid_gsa' };
      if (/blitz/.test(hint)) return { slot: 'lid_blitz' };
      if (/gsd/.test(hint)) return { slot: 'lid_gsd' };
      if (/dto/.test(hint)) return { slot: 'lid_dto_ginfo' };
      return { slot: 'lid_gso', ambiguous: 'GSO ou GSA? O arquivo não diz. Confira.' };
    }
    if (/argus/.test(hint)) return { slot: 'vel_argus' };
    if (/trimble|vfleet|\bps\b/.test(hint)) return { slot: 'vel_trimble' };
    return { slot: 'vel_trimble', ambiguous: 'Trimble ou Argus? O arquivo não diz. Confira.' };
  }
  function classifySheet(fileName, sheetName, aoa) {
    const hint = hintOf(fileName + ' ' + sheetName);
    const cands = [];
    for (const [sid, slot] of Object.entries(SLOTS)) {
      const det = P.detect(aoa, slot); if (!det.ok) continue;
      cands.push({ sid, det, score: detScore(det, slot), anchor: det.map[slot.keyField], row: det.headerRow });
    }
    // famílias com layout igual: fica só a escolhida
    const fams = [['lid', LID_FAMILY], ['vel', VEL_FAMILY]];
    let out = cands.slice(), notes = {};
    for (const [fam, ids] of fams) {
      const fc = out.filter(c => ids.includes(c.sid)); if (!fc.length) continue;
      const best = fc.sort((a, b) => b.score - a.score)[0];
      const pick = pickFamily(fam, aoa, best.det, hint);
      out = out.filter(c => !ids.includes(c.sid));
      const det = P.detect(aoa, SLOTS[pick.slot]);
      if (det.ok) { out.push({ sid: pick.slot, det, score: detScore(det, SLOTS[pick.slot]) + 100, anchor: det.map[SLOTS[pick.slot].keyField], row: det.headerRow }); if (pick.ambiguous) notes[pick.slot] = pick.ambiguous; }
    }
    // uma base por coluna-chave (tabelas lado a lado ficam separadas)
    out.sort((a, b) => b.score - a.score);
    const used = new Set(), acc = [];
    for (const c of out) { const k = c.row + ':' + c.anchor; if (used.has(k)) continue; used.add(k); acc.push(Object.assign(c, { note: notes[c.sid] || null })); }
    return acc;
  }
  async function readAllFiles(files) {
    const tables = [], unknown = [];
    for (const f of files) {
      let wb; try { wb = await readWorkbook(f); } catch (err) { unknown.push(f.name + ' (não abriu)'); continue; }
      const sheets = Array.isArray(wb) ? wb : wb.names.map(n => ({ name: n, get aoa() { return wb.sheet(n); } }));
      const kind = wb.names ? L.kindOf(wb.names) : null;
      if (kind) {   // planilha no formato atual (Termômetro, SIF Conversion ou KPI Liderança): lê pelas abas conhecidas
        for (const sid of Object.keys(SLOTS)) for (const [k, sheet, o] of (L.LEGACY_MAP[sid] || [])) {
          if (k !== kind || !wb.names.includes(sheet)) continue;
          const aoa = wb.sheet(sheet); const opts = o || {}; const det = P.detect(aoa, SLOTS[sid], opts); if (!det.ok) continue;
          if (opts.noStop) det.stopAtBlank = false;
          const rows = P.extract(aoa, SLOTS[sid], det, opts); if (!rows.length) continue;
          tables.push({ file: f.name, sheet, aoa, sid, det, opts, rows, legacy: true }); break;
        }
        continue;
      }
      let found = 0;
      for (const sh of sheets) {
        const aoa = sh.aoa; if (!aoa || !aoa.length) continue;
        for (const c of classifySheet(f.name, sh.name, aoa)) {
          const rows = P.extract(aoa, SLOTS[c.sid], c.det); if (!rows.length) continue;
          tables.push({ file: f.name, sheet: Array.isArray(wb) ? null : sh.name, aoa, sid: c.sid, det: c.det, rows, note: c.note }); found++;
        }
      }
      if (!found) unknown.push(f.name);
    }
    // a mesma base em mais de um arquivo: vale a com mais linhas; as outras ficam como "ignorar"
    const bySlot = {};
    tables.forEach((t, i) => { (bySlot[t.sid] = bySlot[t.sid] || []).push(i); });
    for (const idx of Object.values(bySlot)) if (idx.length > 1) {
      idx.sort((a, b) => (tables[b].legacy ? 0 : 1) - (tables[a].legacy ? 0 : 1) || tables[b].rows.length - tables[a].rows.length);
      idx.slice(1).forEach(i => { tables[i].dup = tables[idx[0]].file; });
    }
    return { tables, unknown };
  }
  function uploadDialog(st) {

    const opts = cur => `<option value="skip" ${cur === 'skip' ? 'selected' : ''}>Ignorar</option>` + GROUPS.map(g => `<optgroup label="${esc(g.title)}">${g.slots.map(s => `<option value="${s}" ${cur === s ? 'selected' : ''}>${esc(SLOTS[s].label)}</option>`).join('')}</optgroup>`).join('');
    const dupChoice = {}; st.tables.forEach(t => { if (t.choice !== 'skip') dupChoice[t.choice] = (dupChoice[t.choice] || 0) + 1; });
    const n = chosen.size;

    $('#dlgInner').querySelectorAll('[data-ti]').forEach(s => s.onchange = () => {

  async function calcMonth() {

  /* ---------- REGRAS ---------- */
  // ---- tabela de quartis (Hurdle, Quartil 1–3 com limite e pontos, Quartil 4 = demais)
  const isPctK = k => SC.kpis[k].fmt !== 'num2';
  const limTxt = (k, v) => v == null ? '' : (isPctK(k) ? String(+(v * 100).toFixed(4)) : String(+v.toFixed(5))).replace('.', ',');
  function quartisBlock() {
    const ed = S.editRegua;
    const canEdit = S.store && S.store.canEdit !== false && S.store.canWrite !== false;
    const unit = k => isPctK(k) ? '%' : '';
    const sign = k => SC.kpis[k].dir === 'menor' ? '<' : '≥';
    const cell = (k, qi) => {
      const q = (SC.kpis[k].quartis || [])[qi] || [null, null];
      if (!ed) return q[0] == null ? '<span class="muted">–</span>' : `<span class="qv">${sign(k)} ${esc(limTxt(k, q[0]))}${unit(k)}</span> <span class="pt ${ptCls(q[1])}">${fmtPts(q[1])} pts</span>`;
      return `<div class="qin"><span class="muted">${sign(k)}</span><input id="q_${k}_${qi}_l" inputmode="decimal" value="${esc(limTxt(k, q[0]))}" aria-label="Limite do quartil ${qi + 1} de ${esc(SC.kpis[k].name)}"><span class="muted">${unit(k)}</span><input id="q_${k}_${qi}_p" class="pts" inputmode="decimal" value="${q[1] == null ? '' : String(q[1]).replace('.', ',')}" aria-label="Pontos do quartil ${qi + 1}"><span class="muted">pts</span></div>`;
    };
    const hcell = k => { const r = SC.kpis[k]; const s = r.dir === 'menor' ? '≤' : '≥';
      if (!ed) return `<span class="qv">${s} ${esc(limTxt(k, r.hurdle))}${unit(k)}</span> <span class="pt p11">${SC.maxPerKpi} pts</span>`;
      return `<div class="qin"><span class="muted">${s}</span><input id="q_${k}_h" inputmode="decimal" value="${esc(limTxt(k, r.hurdle))}" aria-label="Hurdle de ${esc(r.name)}"><span class="muted">${unit(k)}</span><span class="muted">${SC.maxPerKpi} pts</span></div>`; };
    const pcell = k => { const r = SC.kpis[k]; if (!ed) return `<span class="muted">demais</span> <span class="pt ${ptCls(r.pior)}">${fmtPts(r.pior)} pts</span>`;
      return `<div class="qin"><span class="muted">demais</span><input id="q_${k}_pior" class="pts" inputmode="decimal" value="${String(r.pior).replace('.', ',')}" aria-label="Pontos do quartil 4"><span class="muted">pts</span></div>`; };
    const calcMonths = monthsAvailable().filter(m => S.results[m].source === 'calculado');
    return `<div class="section-head"><div class="muted" style="max-width:80ch">Quartis por KPI, como na planilha. O 1º quartil que o resultado atinge define os pontos; quem não atinge nenhum fica no Quartil 4.${S.scMeta && S.scMeta.at ? ` Última alteração em ${new Date(S.scMeta.at).toLocaleString('pt-BR')} por ${esc(nameOf(S.scMeta.by))}.` : ''}</div>
      <div class="filters">${canEdit ? (ed ? '<button class="btn" id="qCancel">Cancelar</button><button class="btn" id="qReset" title="Volta aos valores da planilha de set/2026">Restaurar padrão</button><button class="btn primary" id="qSave">Salvar régua</button>' : '<button class="btn" id="qEdit">Editar quartis</button>') : ''}</div></div>
      ${ed ? `<div class="notice">Percentuais em % (ex.: 8,1). Velocidade e Estouro no valor do KPI. Deixe o limite em branco para não usar o quartil. Ao salvar, a régua passa a valer para os próximos cálculos; marque abaixo os meses já calculados que devem ser recalculados com ela.
        <div class="filters" style="margin-top:8px">${calcMonths.map(m => `<label><input type="checkbox" class="qMonth" value="${m}" ${m === S.month ? 'checked' : ''}> ${esc(monthLabel(m))}</label>`).join('') || '<span class="muted">Nenhum mês calculado.</span>'}</div></div>` : ''}
      <div class="tablebox"><table class="rules quartis"><thead><tr><th>KPI</th><th>Hurdle<span class="dir">nota cheia</span></th><th>Quartil 1</th><th>Quartil 2</th><th>Quartil 3</th><th>Quartil 4</th></tr></thead><tbody>
      ${K.map(k => `<tr><td><b>${esc(SC.kpis[k].name)}</b><div class="muted">${SC.kpis[k].dir === 'menor' ? '↓ menor é melhor' : '↑ maior é melhor'}</div></td><td>${hcell(k)}</td><td>${cell(k, 0)}</td><td>${cell(k, 1)}</td><td>${cell(k, 2)}</td><td>${pcell(k)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function readQuartis() {
    const errs = []; const kpis = {};
    const num = (id, req, pct) => { const raw = ($(id) && $(id).value || '').trim(); if (!raw) return null; const v = P.toNumber(raw.replace('%', '')); if (v == null) { errs.push(raw); return null; } return pct ? v / 100 : v; };
    for (const k of K) {
      const pct = isPctK(k); const r = SC.kpis[k];
      const hurdle = num(`#q_${k}_h`, true, pct);
      if (hurdle == null) errs.push(`${r.name}: informe o hurdle`);
      const quartis = [0, 1, 2].map(i => { const l = num(`#q_${k}_${i}_l`, false, pct), p = num(`#q_${k}_${i}_p`, false, false); return l == null || p == null ? [null, null] : [l, p]; });
      const pior = num(`#q_${k}_pior`, false, false) ?? 0;
      const all = [hurdle, ...quartis.filter(q => q[0] != null).map(q => q[0])];
      const mono = all.every((x, i) => i === 0 || (r.dir === 'menor' ? x >= all[i - 1] : x <= all[i - 1]));
      if (!mono) errs.push(`${r.name}: os limites devem ${r.dir === 'menor' ? 'crescer' : 'diminuir'} do Hurdle para o Quartil 3`);
      if ([...quartis.map(q => q[1]), pior].some(p => p != null && (p < 0 || p > SC.maxPerKpi))) errs.push(`${r.name}: pontos entre 0 e ${SC.maxPerKpi}`);
      kpis[k] = { hurdle, quartis, pior };
    }
    return { kpis, errs };
  }
  async function saveQuartis(kpis) {
    const by = await whoId();
    const months = Array.from(document.querySelectorAll('.qMonth:checked')).map(x => x.value);
    const old = SC; SC = C.mergeScoring({ kpis });
    const docs = months.map(m => ({ m, doc: rescore(S.results[m], m) }));
    try { await S.store.saveBatch([{ type: 'scoring', doc: { kpis, updatedAt: new Date().toISOString(), updatedBy: by } }, ...docs.map(d => ({ type: 'result', m: d.m, doc: d.doc }))]); }
    catch (e) { SC = old; throw e; }
    S.scMeta = { by, at: new Date().toISOString() }; docs.forEach(d => S.results[d.m] = d.doc);
    return months;
  }
  function bindQuartis() {

      const b = $('#qSave'); b.disabled = true; b.textContent = 'Salvando…';
      try { const ms = await saveQuartis(kpis); S.editRegua = false; renderHeader(); renderRegras(); toast(ms.length ? `Régua salva e ${ms.length} mês(es) recalculado(s).` : 'Régua salva. Vale para os próximos cálculos.'); }
      catch (e) { b.disabled = false; b.textContent = 'Salvar régua'; errNotice(e); }
    });
  }
  function renderRegras() {
    const v = $('#view');
    const fixes = K.flatMap(k => (MODS[k].fixes || []).map(f => ({ k, f })));
    v.innerHTML = `<section class="section"><div class="eyebrow">Como cada KPI vira pontos</div><h2>Quartis por KPI</h2>
      <p class="muted" style="max-width:80ch">Cada KPI vale até ${SC.maxPerKpi} pontos; o total vai até ${SC.totalMax}. KPI sem dado fica NA e o total é reescalado proporcionalmente (pontos obtidos × ${SC.totalMax} ÷ pontos possíveis). Empate: maior % de pessoas relatando; persistindo, menor % de motoristas em faixa crítica.</p>
      ${quartisBlock()}
      <div class="tablebox"><table class="rules"><thead><tr><th>KPI</th><th>Cálculo</th><th>Período</th><th>Fonte</th></tr></thead><tbody>
      ${K.map(k => `<tr><td><b>${esc(SC.kpis[k].name)}</b><div class="muted">${SC.kpis[k].dir === 'menor' ? '↓ menor é melhor' : '↑ maior é melhor'}</div></td><td>${esc(KPI_INFO[k].calculo)}</td><td>${esc(KPI_INFO[k].periodo)}</td><td>${esc(KPI_INFO[k].fonte)}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="section"><div class="eyebrow">Diferenças em relação à planilha de setembro</div><h2>Correções aplicadas pelo sistema</h2>
      <p class="muted" style="max-width:80ch">O sistema segue as regras de negócio da planilha, mas corrige erros de fórmula encontrados na conferência de setembro/2026. Estes itens explicam todas as diferenças de pontuação entre o sistema e a planilha.</p>
      <ul class="qlist">${window.TERMO_SCORING_FIXES.map(f => `<li><b>Pontuação:</b> ${esc(f)}</li>`).join('')}${fixes.map(x => `<li><b>${esc(SC.kpis[x.k].name)}:</b> ${esc(x.f)}</li>`).join('')}</ul></section>
      <section class="section"><div class="eyebrow">Definidas pelo responsável</div><h2>Decisões confirmadas</h2>
      <ul class="qlist">${window.TERMO_DECISIONS.map(q => `<li>${esc(q)}</li>`).join('')}</ul></section>

      <ol class="qlist">${window.TERMO_QUESTIONS.map(q => `<li>${esc(q)}</li>`).join('')}</ol></section>
      <section class="section"><div class="eyebrow">Cadastro</div><h2>CDDs no ranking (${MASTER.units.length})</h2>
      <div class="tablebox"><table><thead><tr><th>CDD</th><th>Código</th><th>Regional</th><th>Apoio logístico</th><th>Distribuição urbana</th><th>Centro</th></tr></thead><tbody>
      ${MASTER.units.slice().sort((a, b) => a.geo.localeCompare(b.geo) || a.nomeDemarco.localeCompare(b.nomeDemarco)).map(u => `<tr><td>${esc(u.nomeDemarco)}</td><td class="num">${esc(u.code)}</td><td>${esc(u.geo)}</td><td>${esc(OPNAME[String(u.apoioCode)] || u.apoioName || '–')} <span class="muted">(${esc(u.apoioCode)})</span></td><td>${esc(u.duName || '–')}</td><td>${esc(u.centro || '–')}</td></tr>`).join('')}</tbody></table></div></section>`;

  }

  /* ---------- RESUMO (referência: planilha "Resumo Termômetro") ---------- */
  const RZ_KINDS = [['geos', 'Regional'], ['ops', 'Sócio operador'], ['units', 'CDD']];
  function rzEntities(kind) {
    if (kind === 'geos') return MASTER.geos.map(g => ({ id: g.name, n: g.name === 'Brasil' ? 'Brasil' : g.name }));
    if (kind === 'ops') return MASTER.operators.map(o => ({ id: String(o.code), n: o.name }));
    return MASTER.units.map(u => ({ id: u.key, n: u.nomeDemarco + ' · ' + u.geo })).sort((a, b) => a.n.localeCompare(b.n));
  }
  function rzRow(m, kind, id) {
    const d = S.results[m]; if (!d) return null;
    if (kind === 'geos' && id === 'Brasil') return d.brasil || null;
    return (d[kind] || []).find(r => r.id === id) || null;
  }
  // regressão linear simples (x = nº do mês), limitada a 0–11, como FORECAST.LINEAR da planilha
  function linFit(pts) {
    if (pts.length < 2) return null;
    const n = pts.length, sx = pts.reduce((a, p) => a + p[0], 0), sy = pts.reduce((a, p) => a + p[1], 0);
    const sxx = pts.reduce((a, p) => a + p[0] * p[0], 0), sxy = pts.reduce((a, p) => a + p[0] * p[1], 0);
    const den = n * sxx - sx * sx; if (!den) return null;
    const b = (n * sxy - sx * sy) / den, a = (sy - b * sx) / n;
    return x => Math.min(SC.maxPerKpi, Math.max(0, a + b * x));
  }
  // gráfico de linha 0–11 por mês (Jan–Dez): realizado contínuo + projeção tracejada
  function lineChart(series, opts) {
    const W = opts.w || rzW(), H = opts.h || 220, pl = opts.small ? 6 : 34, pr = 10, pt = opts.small ? 6 : 12, pb = opts.small ? 6 : 26;
    const x = mo => pl + (mo - 1) / 11 * (W - pl - pr), y = v => pt + (1 - v / SC.maxPerKpi) * (H - pt - pb);
    let g = '';
    if (!opts.small) {
      [0, 2.75, 5.5, 8.25, 11].forEach(t => { g += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" class="ax">${fmtN(t, t % 1 ? 2 : 0)}</text>`; });
      for (let mo = 1; mo <= 12; mo++) g += `<text x="${x(mo)}" y="${H - 6}" text-anchor="middle" class="ax">${MONTHS_PT[mo - 1]}</text>`;
    } else g += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" class="grid"/>`;
    const real = series.real, proj = series.proj || [];
    if (proj.length > 1) g += `<polyline class="proj" points="${proj.map(p => x(p[0]) + ',' + y(p[1])).join(' ')}"/>`;
    if (real.length > 1) g += `<polyline class="real" points="${real.map(p => x(p[0]) + ',' + y(p[1])).join(' ')}"/>`;
    real.forEach((p, i) => { const last = i === real.length - 1; g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${opts.small ? (last ? 3 : 2) : (last ? 5 : 4)}" class="${last ? 'dot last' : 'dot'}"><title>${MONTHS_FULL[p[0] - 1]}: ${fmtN(p[1], 2)} pts</title></circle>`; });
    if (!opts.small) proj.slice(1).forEach(p => { g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3" class="pdot"><title>Projeção ${MONTHS_FULL[p[0] - 1]}: ${fmtN(p[1], 2)} pts</title></circle>`; });
    if (!opts.small && real.length) { const l = real[real.length - 1]; g += `<text x="${x(l[0])}" y="${y(l[1]) - 10}" text-anchor="middle" class="lbl">${fmtN(l[1], 2)}</text>`; }
    return `<svg viewBox="0 0 ${W} ${H}" class="chart${opts.small ? ' small' : ''}" role="img" aria-label="${esc(opts.label || '')}">${g}</svg>`;
  }
  // barras horizontais 0–11, ordenadas da maior para a menor pontuação
  function barsChart(items) {
    const W = rzW(), rowH = 26, pl = 110, pr = 120, H = items.length * rowH + 24;
    const x = v => pl + v / SC.maxPerKpi * (W - pl - pr);
    let g = '';
    [0, 5.5, 11].forEach(t => { g += `<line x1="${x(t)}" x2="${x(t)}" y1="4" y2="${H - 18}" class="grid"/><text x="${x(t)}" y="${H - 4}" text-anchor="middle" class="ax">${fmtN(t, t % 1 ? 1 : 0)}</text>`; });
    items.forEach((it, i) => {
      const yy = 6 + i * rowH; const w = it.p == null ? 0 : Math.max(it.p > 0 ? 4 : 0, x(it.p) - pl);
      g += `<g><title>${esc(it.name)}: ${it.p == null ? 'sem dado' : fmtPts(it.p) + ' pts'} (${esc(it.val)})</title>
        <text x="${pl - 8}" y="${yy + 15}" text-anchor="end" class="lbl2">${esc(it.short)}</text>
        ${it.p == null ? `<text x="${pl + 4}" y="${yy + 15}" class="ax">sem dado</text>` : `<rect x="${pl}" y="${yy + 3}" width="${w}" height="${rowH - 9}" rx="4" class="bar ${ptCls(it.p)}"/>`}
        <text x="${it.p == null ? pl + 70 : pl + w + 6}" y="${yy + 15}" class="lbl">${it.p == null ? '' : fmtPts(it.p)}<tspan class="ax"> · ${esc(it.val)}</tspan></text></g>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Pontuação por KPI no mês">${g}</svg>`;
  }
  // largura do desenho acompanha a tela, para o texto do gráfico não encolher no celular
  function rzW() { const w = ($('#view') && $('#view').clientWidth) || 1200; return Math.max(340, Math.min(640, w >= 980 ? (w - 60) / 2 : w - 30)); }
  function renderResumo() {
    const v = $('#view');
    S.rz = S.rz || { kind: 'geos', id: 'Brasil' };
    const ents = rzEntities(S.rz.kind);
    if (!ents.find(e => e.id === S.rz.id)) S.rz.id = ents[0].id;
    const { kind, id } = S.rz;
    const y = S.month.slice(0, 4);
    const months = monthsAvailable().filter(m => m.startsWith(y) && m <= S.month);
    const rows = months.map(m => ({ m, mo: +m.slice(5), r: rzRow(m, kind, id) })).filter(x => x.r && x.r.t != null);
    const cur = rzRow(S.month, kind, id);
    const det = rows.filter(x => x.r.v);
    const name = (ents.find(e => e.id === id) || {}).n || id;
    // performance média (0–11) = total ÷ 10 (o total já é reescalado para 110)
    const avgPts = rows.map(x => [x.mo, x.r.t / (SC.totalMax / SC.maxPerKpi)]);
    const fit = linFit(avgPts);
    const lastMo = avgPts.length ? avgPts[avgPts.length - 1][0] : null;
    const proj = fit && lastMo < 12 ? [[lastMo, avgPts[avgPts.length - 1][1]]].concat(Array.from({ length: 12 - lastMo }, (_, i) => [lastMo + 1 + i, fit(lastMo + 1 + i)])) : [];
    const yearAvg = avgPts.length ? avgPts.reduce((a, p) => a + p[1], 0) / avgPts.length : null;
    const periodo = rows.length ? `${MONTHS_PT[rows[0].mo - 1]}–${MONTHS_PT[rows[rows.length - 1].mo - 1]} ${y}` : '–';
    const sel = `<div class="filters"><div class="seg" role="group" aria-label="Tipo de consulta">${RZ_KINDS.map(([k, l]) => `<button data-rzk="${k}" aria-pressed="${k === kind}">${l}</button>`).join('')}</div>
      <select id="rzSel" aria-label="Escolher ${esc(RZ_KINDS.find(k => k[0] === kind)[1])}">${ents.map(e => `<option value="${esc(e.id)}" ${e.id === id ? 'selected' : ''}>${esc(e.n)}</option>`).join('')}</select></div>`;
    const tiles = `<div class="tiles">
      <div class="tile"><span class="eyebrow">Visão atual</span><b>${esc(kind === 'units' ? (UNIT[id] ? UNIT[id].nomeDemarco : id) : name)}</b><span class="muted">${esc(RZ_KINDS.find(k => k[0] === kind)[1])}${kind === 'units' && UNIT[id] ? ' · ' + esc(UNIT[id].geo) : ''}</span></div>
      <div class="tile"><span class="eyebrow">${esc(monthLabel(S.month))}</span><b class="num">${cur && cur.t != null ? fmtN(cur.t, 2) : '–'}<small> / ${SC.totalMax}</small></b><span class="muted">${!cur ? 'sem apuração no mês' : (id === 'Brasil' ? 'Total Brasil' : (cur.r ? cur.r + 'º no ranking do mês' : ''))}</span></div>
      <div class="tile"><span class="eyebrow">Média ${y} por KPI</span><b class="num">${yearAvg == null ? '–' : fmtN(yearAvg, 2)}<small> / ${SC.maxPerKpi}</small></b><span class="muted">Período realizado: ${esc(periodo)}</span></div>
      <div class="tile"><span class="eyebrow">Projeção para dezembro</span><b class="num">${fit && lastMo < 12 ? fmtN(fit(12), 2) : '–'}<small> / ${SC.maxPerKpi}</small></b><span class="muted">Tendência linear dos meses realizados</span></div></div>`;
    // tabela KPIs × meses
    const allMo = Array.from({ length: 12 }, (_, i) => i + 1);
    const byMo = Object.fromEntries(rows.map(x => [x.mo, x.r]));
    const kAvg = (i, field) => { const xs = det.map(x => x.r[field][i]).filter(z => z != null); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
    const tbl = `<div class="tablebox"><table class="rztable"><thead><tr><th>Indicador</th><th>Média ${y}</th>${allMo.map(mo => `<th class="${mo === +S.month.slice(5) ? 'curm' : ''}">${MONTHS_PT[mo - 1]}</th>`).join('')}</tr></thead><tbody>
      ${K.map((k, i) => `<tr><td class="name"><div class="n">${esc(SC.kpis[k].name)}</div><div class="s">${SC.kpis[k].dir === 'menor' ? '↓ menor é melhor' : '↑ maior é melhor'}</div></td>
        <td><div class="kc"><span class="v">${kAvg(i, 'v') == null ? '–' : fmtVal(k, kAvg(i, 'v'))}</span>${kAvg(i, 'p') == null ? '' : `<span class="pt ${ptCls(kAvg(i, 'p'))}">${fmtN(kAvg(i, 'p'), 2)}</span>`}</div></td>
        ${allMo.map(mo => { const r = byMo[mo]; if (!r || !r.v) return `<td class="muted ${mo === +S.month.slice(5) ? 'curm' : ''}">${r ? '·' : ''}</td>`;
          return `<td class="${mo === +S.month.slice(5) ? 'curm' : ''}"><div class="kc"><span class="v">${r.v[i] == null ? 'sem dado' : fmtVal(k, r.v[i])}${(r.m || []).includes(i) ? ' <span class="man">manual</span>' : ''}</span><span class="pt ${ptCls(r.p[i])}">${fmtPts(r.p[i])}</span></div></td>`; }).join('')}</tr>`).join('')}
      <tr class="brasil"><td>Média total (pts por KPI)</td><td class="num">${yearAvg == null ? '–' : fmtN(yearAvg, 2)}</td>${allMo.map(mo => { const r = byMo[mo]; return `<td class="num ${mo === +S.month.slice(5) ? 'curm' : ''}">${r ? fmtN(r.t / (SC.totalMax / SC.maxPerKpi), 2) : ''}</td>`; }).join('')}</tr>
      <tr><td>Total do mês (0–${SC.totalMax})</td><td></td>${allMo.map(mo => { const r = byMo[mo]; return `<td class="num ${mo === +S.month.slice(5) ? 'curm' : ''}">${r ? fmtN(r.t, 2) + (r.r && id !== 'Brasil' ? `<div class="muted" style="font-size:.72rem">${r.r}º</div>` : '') : ''}</td>`; }).join('')}</tr>
      </tbody></table></div>
      <p class="muted" style="font-size:.8rem">"·" = mês sem os KPIs abertos para esta seleção. Total do mês = resultado oficial do Histórico T2.${(() => { const ms = rows.filter(x => S.results[x.m].source === 'historico' && S.results[x.m].kpiConfere === false).map(x => MONTHS_PT[x.mo - 1]); return ms.length ? ` Em ${ms.join(', ')}, os pontos por KPI vêm da planilha do mês e não fecham com o total oficial.` : ''; })()}</p>`;
    // barras do mês
    const bars = cur && cur.v ? barsChart(K.map((k, i) => ({ name: SC.kpis[k].name, short: SC.kpis[k].short, p: cur.p[i], val: cur.v[i] == null ? 'sem dado' : fmtVal(k, cur.v[i]) })).sort((a, b) => (b.p == null ? -1 : b.p) - (a.p == null ? -1 : a.p)))
      : `<div class="empty">Sem KPIs abertos em ${esc(monthLabel(S.month))}.</div>`;
    // pequenos múltiplos por KPI
    const multiples = K.map((k, i) => {
      const real = det.filter(x => x.r.p[i] != null).map(x => [x.mo, x.r.p[i]]);
      const f = linFit(real); const lm = real.length ? real[real.length - 1][0] : null;
      const pj = f && lm < 12 ? [[lm, real[real.length - 1][1]]].concat(Array.from({ length: 12 - lm }, (_, j) => [lm + 1 + j, f(lm + 1 + j)])) : [];
      const last = real.length ? real[real.length - 1][1] : null;
      return `<div class="mult"><div class="mh"><span>${esc(SC.kpis[k].short)}</span>${last == null ? '<span class="muted">–</span>' : `<span class="pt ${ptCls(last)}">${fmtPts(last)}</span>`}</div>${lineChart({ real, proj: pj }, { small: true, w: 220, h: 80, label: 'Tendência ' + SC.kpis[k].name })}<div class="muted mf">${real.length < 2 ? 'Projeção a partir de 2 meses com KPIs abertos' : `Projeção dez: ${fmtN(f(12), 2)} pts`}</div></div>`;
    }).join('');
    v.innerHTML = `<section class="section"><div class="section-head"><div><div class="eyebrow">Performance de segurança ${y}</div><h2>Resumo por ${esc(RZ_KINDS.find(k => k[0] === kind)[1].toLowerCase())}</h2></div>${sel}</div>${tiles}</section>
      <div class="rzgrid">
        <section class="section card"><div><h3>Performance média — realizado e projeção</h3><div class="muted">Pontuação média por KPI (0–${SC.maxPerKpi}) · <span class="key real"></span> realizado <span class="key proj"></span> projeção linear</div></div>${lineChart({ real: avgPts, proj }, { label: 'Performance média mensal' })}</section>
        <section class="section card"><div><h3>KPIs em ${esc(monthLabel(S.month))}</h3><div class="muted">Do melhor para o pior, em pontos (0–${SC.maxPerKpi})</div></div>${bars}</section>
      </div>
      <section class="section"><div><div class="eyebrow">Acompanhamento mensal</div><h2>Indicadores e pontos</h2></div>${tbl}</section>
      <section class="section"><div><div class="eyebrow">Tendência anual</div><h2>Pontos por KPI — realizado e projeção</h2></div><div class="multiples">${multiples}</div></section>`;
    v.querySelectorAll('[data-rzk]').forEach(b => b.onclick = () => { S.rz = { kind: b.dataset.rzk, id: b.dataset.rzk === 'geos' ? 'Brasil' : null }; try { localStorage.setItem('termo.rz', JSON.stringify(S.rz)); } catch (e) { } renderResumo(); });
    $('#rzSel').onchange = e => { S.rz.id = e.target.value; try { localStorage.setItem('termo.rz', JSON.stringify(S.rz)); } catch (er) { } renderResumo(); };
  }

  /* ---------- casca ---------- */
  function openDialog(html) { const d = $('#dlg'); $('#dlgInner').innerHTML = html; $('#dlgInner').querySelectorAll('[data-close]').forEach(b => b.onclick = closeDialog); if (!d.open) d.showModal(); }
  function closeDialog() { const d = $('#dlg'); if (d.open) d.close(); }
  $('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) closeDialog(); });

  function renderHeader() {
    const res = S.results[S.month];
    const br = res && res.brasil;
    let html = '', h = 0;
    if (S.view === 'ano') {
      const yb = yearRows(S.month, 'brasil')[0];
      if (yb) { h = yb.avg / SC.totalMax * 100; html = `<span class="eyebrow">Brasil · média ${S.month.slice(0, 4)}</span><span class="big num">${fmtN(yb.avg, 1)}<small> / ${SC.totalMax}</small></span>`; }
    } else if (br && br.t != null) {
      h = br.t / SC.totalMax * 100; html = `<span class="eyebrow">Brasil · ${esc(monthLabel(S.month))}</span><span class="big num">${fmtN(br.t, br.t % 1 ? 2 : 0)}<small> / ${SC.totalMax}</small></span>`;
    } else html = `<span class="eyebrow">Brasil</span><span class="muted">sem apuração</span>`;
    $('#brScore').innerHTML = html; $('#hg').style.height = h + '%';
    $('#subtitle').textContent = S.view === 'ano' ? `Acumulado de ${S.month.slice(0, 4)} até ${monthLabel(S.month)}` : `Apuração de ${monthLabel(S.month)}`;
  }
  function setTab(t) {
    S.tab = t;
    [['ranking', '#tabRanking'], ['resumo', '#tabResumo'], ['bases', '#tabBases'], ['regras', '#tabRegras']].forEach(([k, s]) => $(s).setAttribute('aria-selected', String(k === t)));
    try { localStorage.setItem('termo.tab', t); } catch (e) { }
    render();
  }
  function render() { renderHeader(); if (S.tab === 'ranking') renderRanking(); else if (S.tab === 'resumo') renderResumo(); else if (S.tab === 'bases') renderBases(); else renderRegras(); }
  $('#tabRanking').onclick = () => setTab('ranking');
  $('#tabResumo').onclick = () => setTab('resumo');
  $('#tabBases').onclick = () => setTab('bases');
  $('#tabRegras').onclick = () => setTab('regras');
  $('#vMes').onclick = () => { S.view = 'mes'; $('#vMes').setAttribute('aria-pressed', 'true'); $('#vAno').setAttribute('aria-pressed', 'false'); if (S.tab !== 'ranking') setTab('ranking'); else render(); };
  $('#vAno').onclick = () => { S.view = 'ano'; $('#vAno').setAttribute('aria-pressed', 'true'); $('#vMes').setAttribute('aria-pressed', 'false'); if (S.tab !== 'ranking') setTab('ranking'); else render(); };
  $('#monthSel').onchange = e => { S.month = e.target.value; render(); };

  async function boot() {
    const ms0 = '2026-09'; S.month = ms0;
    $('#view').innerHTML = '<div class="empty">Carregando apurações salvas…</div>';
    renderMonthSel(); renderHeader();
    const claude = window.claude;
    const [db, user] = await Promise.all([claude && claude.use ? claude.use('db').catch(() => null) : null, claude && claude.use ? claude.use('user').catch(() => null) : null]);
    const ghCfg = window.TermoStores.githubConfig();
    if (db) S.store = window.TermoStores.claudeStore(db, user);
    else if (ghCfg) S.store = window.TermoStores.githubStore(ghCfg);
    if (S.store) {
      try { await S.store.init(); } catch (e) { $('#globalNotice').innerHTML = `<div class="notice err">GitHub: ${esc(e.message)}. Confira o token em "GitHub".</div>`; }
      try { await loadResults(); await loadOverrides(); await loadScoring(); } catch (e) { $('#globalNotice').innerHTML = `<div class="notice err">Não consegui ler as apurações (${esc(e.code || e.message)}).</div>`; }
    } else {
      $('#globalNotice').innerHTML = '<div class="notice warn">Nenhum armazenamento configurado. Clique em "GitHub" no topo para informar o repositório onde ficam os dados.</div>';
    }
    if (!db) { const b = $('#ghBtn'); b.hidden = false; b.textContent = S.store && S.store.kind === 'github' ? (S.store.canWrite ? 'GitHub · ' + (S.store.user ? S.store.user.login : 'edição') : 'GitHub · leitura') : 'GitHub'; b.onclick = githubDialog; }
    const ms = monthsAvailable();
    S.month = ms.length ? ms[ms.length - 1] : ms0;
    await resolveNames(ms.map(m => S.results[m].computedBy));
    let t = 'ranking'; try { t = localStorage.getItem('termo.tab') || 'ranking'; } catch (e) { }
    renderMonthSel(); try { const z = JSON.parse(localStorage.getItem('termo.rz') || 'null'); if (z && z.kind) S.rz = z; } catch (e) { }
    setTab(['ranking', 'resumo', 'bases', 'regras'].includes(t) ? t : 'ranking');
  }
  boot();
})();

</script>

</body>
</html>
